# Research-integrity checks (DECISIONS D-101, D-104): the held-out lock tests, the frozen-code
# check, both held-out gates, the paper's generated files against a fresh build from the
# hash-pinned frozen results, and the release scans over the full history.
# Push to main only: a pull-request merge commit is authored by GitHub, not the project author.
name: research-integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: System packages (egl_probe build, OSMesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential libegl-dev libosmesa6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.11"
          enable-cache: true
      - name: Locked environment
        run: uv sync --frozen
      - name: Held-out lock and gate tests
        run: uv run --frozen pytest tests/research_integrity
      - name: Frozen code unchanged
        run: make freeze-check
      - name: Held-out gates
        run: |
          uv run --frozen python scripts/run_rgb_heldout.py gate
          uv run --frozen python scripts/run_pc_heldout.py gate
      - name: Paper tables, figures and numbers equal a fresh build
        run: make paper-check
      - name: Release scans (identity, trailers, secrets, paths, docs, README)
        run: make release-check
