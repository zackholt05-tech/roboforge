# X3 (DECISIONS D-111, separate replication): the frozen chosen Can configuration of
# bc_rnn, trial 2 (optim.schedule=cosine) of the Session 7 search (tuning record reports/session7/tuning/bc_rnn_can.json;
# docs/FINAL_TEST_FREEZE.md §3), written out so that a one-trial suite plan can train it
# with new seeds. It equals configs/models/bc_rnn.yaml with that override applied, nothing else.
# With seed 0 and the plan's budget and task it resolves to the config of s7_bc_rnn_cos_can_seed0_5ff5ce91
# (config SHA-256 5ff5ce910b83d538...; tests/unit/test_x3_configs.py).
schema: roboforge.train_config/1
name: bc_rnn_cos
family: bc_rnn
task: lift
seed: 0
horizons: {obs: 10, pred: 1, exec: 1}
model: {cell: lstm, hidden: 296, layers: 2, dropout: 0.0}
loss: {kind: mse}
optim: {name: adamw, lr: 1.0e-4, betas: [0.9, 0.999], weight_decay: 0.0, schedule: cosine}
train: {max_steps: 30000, batch_size: 100, ckpt_every: 5000, val_every: 1000, log_every: 100,
        num_threads: 1, grad_clip: null}
